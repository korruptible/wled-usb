<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLED USB bridge</title>
<style>
  :root { color-scheme: dark; --bg:#0e0e10; --card:#17171a; --line:#2a2a30;
          --txt:#e6e6e9; --dim:#9a9aa4; --ok:#37d67a; --ko:#ef5350; --accent:#4ea8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
           padding:1.2rem 1.5rem; border-bottom:1px solid var(--line); }
  h1 { font-size:1.15rem; margin:0; }
  header a { color:var(--accent); text-decoration:none; font-size:.9rem; }
  header .spacer { flex:1; }
  header select { background:#0b0b0d; color:var(--txt); border:1px solid var(--line);
                  border-radius:6px; padding:.3rem .45rem; font:inherit; font-size:.82rem; }
  main { max-width:56rem; margin:0 auto; padding:1.5rem; display:grid; gap:1.25rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.1rem 1.25rem; }
  h2 { font-size:1rem; margin:0 0 .85rem; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:.35rem 1rem; margin:0; font-size:.92rem; }
  dt { color:var(--dim); }
  dd { margin:0; font-variant-numeric:tabular-nums; }
  .pill { display:inline-flex; align-items:center; gap:.45rem; font-weight:600; }
  .dot { width:.6rem; height:.6rem; border-radius:50%; background:var(--ko); }
  .dot.on { background:var(--ok); }
  .row { display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:.9rem; }
  label { display:block; font-size:.8rem; color:var(--dim); margin-bottom:.3rem; }
  input[type=text], input[type=number], select {
    background:#0b0b0d; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:.45rem .6rem; font:inherit; font-size:.9rem; }
  input[type=file] { font-size:.85rem; }
  button { background:var(--accent); color:#06121f; border:0; border-radius:6px;
           padding:.55rem 1rem; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .warn { background:#2a1d0c; border:1px solid #5a3f14; color:#f0c478;
          border-radius:6px; padding:.65rem .8rem; font-size:.87rem; margin-bottom:.9rem; }
  pre { background:#08080a; border:1px solid var(--line); border-radius:6px;
        padding:.75rem; margin:0; max-height:22rem; overflow:auto;
        font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
  .muted { color:var(--dim); font-size:.87rem; }
  .err { color:var(--ko); }
  .preset { display:flex; align-items:center; gap:.6rem; margin-bottom:.45rem; }
  .preset .slot { width:2.2rem; color:var(--dim); font-variant-numeric:tabular-nums; }
  .preset input { flex:1; max-width:22rem; }
  h3 { font-size:.82rem; text-transform:uppercase; letter-spacing:.06em;
       color:var(--dim); margin:1.2rem 0 .6rem; font-weight:600; }
  .pat, .rule { display:flex; align-items:center; gap:.5rem; margin-bottom:.45rem; flex-wrap:wrap; }
  .pat .nm { width:5.5rem; font-weight:600; }
  .pat input[type=number] { width:4.2rem; }
  .pat input[type=color] { width:2.4rem; height:1.9rem; padding:0; border:1px solid var(--line);
                           border-radius:5px; background:#0b0b0d; }
  .rule input { width:10rem; }
  .unit { color:var(--dim); font-size:.78rem; }
  .toggle { display:flex; align-items:center; gap:.5rem; font-size:.92rem;
            color:var(--txt); margin-bottom:.4rem; }
  table.log { width:100%; border-collapse:collapse; font-size:.85rem; }
  table.log td { padding:.25rem .5rem .25rem 0; border-bottom:1px solid var(--line); }
  table.log td:last-child { color:var(--dim); text-align:right; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="app.title">WLED USB bridge</h1>
  <a href="/" data-i18n="app.back">← control interface</a>
  <span class="spacer"></span>
  <select id="lang" aria-label="Language"></select>
</header>

<main>
  <section>
    <h2 data-i18n="link.title">Link status</h2>
    <dl id="status">
      <dt data-i18n="link.link">Link</dt><dd class="muted">…</dd>
    </dl>
    <p class="muted" id="mismatch" hidden></p>
  </section>

  <section>
    <h2 data-i18n="presets.title">Presets</h2>
    <p class="muted" data-i18n="presets.intro"></p>
    <div class="row">
      <div>
        <label for="scanTo" data-i18n="presets.scanTo">Scan slots 1 to</label>
        <input type="number" id="scanTo" value="25" min="1" max="250" style="width:5rem">
      </div>
      <button class="ghost" id="scan" data-i18n="presets.scan">Scan</button>
    </div>
    <div id="presets" class="muted">…</div>
  </section>

  <section>
    <h2 data-i18n="notify.title">Notifications</h2>
    <label class="toggle"><input type="checkbox" id="notifEnabled">
      <span data-i18n="notify.enable">Enable notifications</span></label>
    <p class="muted" id="notifSources">…</p>

    <h3 data-i18n="notify.patterns">Patterns</h3>
    <div id="patterns"></div>
    <p class="muted" id="notifBudget"></p>

    <h3 data-i18n="notify.rules">Rules — phone application → pattern</h3>
    <div id="rules"></div>
    <div class="row" style="margin-top:.6rem">
      <button class="ghost" id="addRule" data-i18n="notify.addRule">Add a rule</button>
      <button id="saveNotif" data-i18n="notify.save">Save</button>
      <span class="muted" id="notifSaved"></span>
    </div>

    <h3 data-i18n="notify.log">Log</h3>
    <div id="notifLog" class="muted">…</div>
  </section>

  <section>
    <h2 data-i18n="audio.title">Computer audio</h2>
    <p class="muted" id="audioState">…</p>
    <div id="audioMeter" style="height:10px;background:#1a1a1e;border:1px solid var(--line);
         border-radius:5px;overflow:hidden;margin:.5rem 0">
      <div id="audioBar" style="height:100%;width:0;background:linear-gradient(90deg,#2f7,#fd4,#f55);
           transition:width .1s linear"></div>
    </div>
    <div class="row">
      <label><span data-i18n="audio.renderer">Renderer</span>
        <select id="audioMode"></select>
      </label>
      <label><span data-i18n="audio.palette">Palette</span>
        <select id="audioPalette"></select>
      </label>
      <label><span data-i18n="audio.gain">Gain</span> <span class="muted" id="audioGainValue"></span>
        <input type="range" id="audioGain" min="0.2" max="6" step="0.1">
      </label>
      <label class="toggle"><input type="checkbox" id="audioAuto">
        <span data-i18n="audio.auto">Automatic gain</span>
        <span class="muted" id="audioDrive"></span>
      </label>
      <label><span data-i18n="audio.fps">Frames/s</span> <span class="muted" id="audioFpsValue"></span>
        <input type="range" id="audioFps" min="5" max="60" step="1">
      </label>
    </div>
    <div class="row">
      <label><span data-i18n="audio.curve">Detail</span> <span class="muted" id="audioCurveValue"></span>
        <input type="range" id="audioCurve" min="0.2" max="1" step="0.05">
      </label>
      <label><span data-i18n="audio.floor">Floor</span> <span class="muted" id="audioFloorValue"></span>
        <input type="range" id="audioFloor" min="0" max="0.4" step="0.01">
      </label>
    </div>
    <p class="muted" data-i18n="audio.help"></p>
    <p class="muted" id="audioCounters"></p>
    <p class="muted" data-i18n="audio.capture"></p>
  </section>

  <section>
    <h2 data-i18n="flash.title">Firmware update</h2>
    <div class="warn" data-i18n="flash.warn"></div>
    <div class="row">
      <div>
        <label for="file" data-i18n="flash.image">.bin image</label>
        <input type="file" id="file" accept=".bin,application/octet-stream">
      </div>
      <div>
        <label for="offset" data-i18n="flash.offset">Address</label>
        <input type="text" id="offset" value="0x10000" size="9">
      </div>
      <div>
        <label for="baud" data-i18n="flash.baud">Baud rate</label>
        <select id="baud">
          <option>115200</option><option>230400</option>
          <option selected>460800</option><option>921600</option>
        </select>
      </div>
      <button id="go" data-i18n="flash.go">Flash</button>
      <button class="ghost" id="probe" data-i18n="flash.probe">Test the bootloader</button>
      <button class="ghost" id="clear" data-i18n="flash.clear">Clear the log</button>
    </div>
    <p class="muted" data-i18n="flash.note"></p>
    <pre id="log" data-i18n="flash.logEmpty"></pre>
  </section>
</main>

<footer style="text-align:center;padding:0 1.5rem 2rem;color:var(--dim);font-size:.75rem;opacity:.55">
  made with ❤️ by Matthieu Jeannin 🇫🇷
</footer>

const LANGUAGE_NAMES = { en: "English", fr: "Français" };

const $ = (id) => document.getElementById(id);
let lang = "en";
let logCursor = 0, flashing = false;

function t(key, ...args) {
  const entry = (I18N[lang] || {})[key] ?? (I18N.en || {})[key];
  if (entry === undefined) return key;
  return typeof entry === "function" ? entry(...args) : entry;
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("app.title");
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    node.innerHTML = t(node.dataset.i18n);
  });
}

async function setLanguage(next, persist) {
  lang = I18N[next] ? next : "en";
  if (persist) {
    await fetch("/bridge/ui", { method: "POST", body: JSON.stringify({ language: lang }) });
  }
  applyStatic();
  audioConfig = null;
  refreshStatus();
  refreshPresets();
  refreshNotify();
  refreshAudio();
}

async function initLanguage() {
  let data = { language: "en", languages: ["en"] };
  try { data = await (await fetch("/bridge/ui")).json(); } catch {}
  $("lang").innerHTML = (data.languages || ["en"])
    .map((code) => `<option value="${code}"${code === data.language ? " selected" : ""}>` +
                   `${LANGUAGE_NAMES[code] || code}</option>`).join("");
  await setLanguage(data.language, false);
}

$("lang").onchange = () => setLanguage($("lang").value, true);

function line(key, value) {
  return `<dt>${key}</dt><dd>${value ?? "—"}</dd>`;
}

async function refreshStatus() {
  const box = $("status");
  let s;
  try {
    s = await (await fetch("/bridge/status")).json();
  } catch {
    box.innerHTML = `<dt>${t("link.link")}</dt><dd class="err">${t("link.unreachable")}</dd>`;
    return;
  }
  const d = s.device || {};
  box.innerHTML =
    `<dt>${t("link.link")}</dt><dd><span class="pill"><span class="dot${s.connected ? " on" : ""}"></span>` +
    `${s.connected ? t("link.connected") : t("link.disconnected")}</span></dd>` +
    line(t("link.port"), `${s.port} @ ${s.baudrate} ${t("link.baud")}`) +
    line(t("link.module"), d.name) +
    line(t("link.firmware"), d.version ? `${d.version} (${d.arch})` : null) +
    line(t("link.leds"), d.ledCount != null ? `${d.ledCount} · ${d.fps ?? "?"} fps` : null) +
    line(t("link.uptime"), d.uptime != null ? `${d.uptime} s` : null) +
    line(t("link.memory"), d.freeHeap != null ? `${(d.freeHeap / 1024).toFixed(0)} KiB` : null) +
    line(t("link.clients"), s.wsClients) +
    (s.error ? `<dt>${t("link.error")}</dt><dd class="err">${s.error}</dd>` : "");
  const m = $("mismatch");
  m.hidden = !s.dataMismatch;
  m.textContent = s.dataMismatch ? t("link.mismatch", s.dataVersion, s.dataMismatch) : "";
}

async function pollFlash() {
  const s = await (await fetch(`/bridge/flash/status?since=${logCursor}`)).json();
  if (s.lines.length) {
    const pre = $("log");
    if (logCursor === 0) pre.textContent = "";
    pre.textContent += s.lines.join("\n") + "\n";
    pre.scrollTop = pre.scrollHeight;
    logCursor = s.next;
  }
  if (s.running) return setTimeout(pollFlash, 400);
  flashing = false;
  $("go").disabled = false;
  $("go").textContent = t("flash.go");
}

$("go").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return alert(t("flash.pickFile"));
  const offset = $("offset").value.trim();
  if (!confirm(t("flash.confirm", file.name, (file.size / 1024).toFixed(0), offset))) return;

  flashing = true;
  logCursor = 0;
  $("go").disabled = true;
  $("go").textContent = t("flash.running");
  $("log").textContent = "";

  const url = `/bridge/flash?offset=${encodeURIComponent(offset)}&baud=${$("baud").value}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/octet-stream" },
    body: file,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    $("log").textContent = t("flash.failed", err.error);
    flashing = false;
    $("go").disabled = false;
    $("go").textContent = t("flash.go");
    return;
  }
  pollFlash();
};

$("probe").onclick = async () => {
  flashing = true;
  logCursor = 0;
  $("log").textContent = "";
  const res = await fetch("/bridge/flash/probe", { method: "POST" });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    $("log").textContent = t("flash.failed", err.error);
    flashing = false;
    return;
  }
  pollFlash();
};

$("clear").onclick = () => { $("log").textContent = t("flash.logCleared"); };

async function refreshPresets() {
  const box = $("presets");
  let store;
  try { store = await (await fetch("/presets.json")).json(); } catch { return; }
  const slots = Object.keys(store).filter((k) => k !== "0").sort((a, b) => a - b);
  if (!slots.length) {
    box.textContent = t("presets.none");
    return;
  }
  box.innerHTML = slots.map((s) => {
    const name = String(store[s].n ?? "").replace(/"/g, "&quot;");
    return `<div class="preset"><span class="slot">${s}</span>` +
           `<input type="text" data-slot="${s}" value="${name}">` +
           `<button class="ghost" data-forget="${s}">${t("presets.forget")}</button></div>`;
  }).join("");
  box.querySelectorAll("input[data-slot]").forEach((input) => {
    input.onchange = async () => {
      await fetch(`/bridge/presets/name?slot=${input.dataset.slot}`,
                  { method: "POST", body: JSON.stringify({ n: input.value }) });
      refreshPresets();
    };
  });
  box.querySelectorAll("button[data-forget]").forEach((button) => {
    button.onclick = async () => {
      await fetch(`/bridge/presets/forget?slot=${button.dataset.forget}`, { method: "POST" });
      refreshPresets();
    };
  });
}

$("scan").onclick = async () => {
  const button = $("scan");
  button.disabled = true;
  button.textContent = t("presets.scanning");
  try {
    await fetch(`/bridge/presets/scan?to=${$("scanTo").value}`, { method: "POST" });
  } finally {
    button.disabled = false;
    button.textContent = t("presets.scan");
    refreshPresets();
  }
};

let notifConfig = null;

const hex = (rgb) => "#" + rgb.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
const rgb = (value) => [1, 3, 5].map((i) => parseInt(value.slice(i, i + 2), 16));

function renderPatterns() {
  $("patterns").innerHTML = Object.entries(notifConfig.patterns).map(([name, p]) => `
    <div class="pat" data-name="${name}">
      <span class="nm">${name}</span>
      <input type="color" data-k="color" value="${hex(p.color)}">
      <input type="number" data-k="leds" value="${p.leds ?? ""}" min="1" max="2000" title="${t("notify.litLeds")}"><span class="unit">leds</span>
      <input type="number" data-k="bri" value="${p.bri}" min="1" max="255" title="${t("notify.brightness")}"><span class="unit">bri</span>
      <input type="number" data-k="flashes" value="${p.flashes}" min="1" max="20" title="${t("notify.flashCount")}"><span class="unit">${t("notify.unitFlashes")}</span>
      <button class="ghost" data-test="${name}">${t("notify.test")}</button>
    </div>`).join("");

  $("patterns").querySelectorAll("input").forEach((input) => {
    input.onchange = () => {
      const name = input.closest(".pat").dataset.name;
      const key = input.dataset.k;
      notifConfig.patterns[name][key] = key === "color" ? rgb(input.value) : Number(input.value);
    };
  });
  $("patterns").querySelectorAll("button[data-test]").forEach((button) => {
    button.onclick = () => fetch(`/bridge/notify/test?pattern=${encodeURIComponent(button.dataset.test)}`,
                                 { method: "POST" });
  });
}

function renderRules() {
  const names = Object.keys(notifConfig.patterns);
  $("rules").innerHTML = notifConfig.rules.map((rule, index) => `
    <div class="rule" data-i="${index}">
      <input type="text" data-k="app" value="${String(rule.app).replace(/"/g, "&quot;")}" placeholder="Slack">
      <span class="unit">→</span>
      <select data-k="pattern">${names.map((n) =>
        `<option${n === rule.pattern ? " selected" : ""}>${n}</option>`).join("")}</select>
      <button class="ghost" data-del="${index}">${t("notify.remove")}</button>
    </div>`).join("");

  $("rules").querySelectorAll("input,select").forEach((field) => {
    field.onchange = () => {
      const index = Number(field.closest(".rule").dataset.i);
      notifConfig.rules[index][field.dataset.k] = field.value;
    };
  });
  $("rules").querySelectorAll("button[data-del]").forEach((button) => {
    button.onclick = () => {
      notifConfig.rules.splice(Number(button.dataset.del), 1);
      renderRules();
    };
  });
}

function renderLog(recent) {
  if (!recent.length) { $("notifLog").textContent = t("notify.logEmpty"); return; }
  $("notifLog").innerHTML = "<table class='log'>" + recent.slice(0, 12).map((e) => {
    const when = new Date(e.at * 1000).toLocaleTimeString();
    const what = [e.app, e.title].filter(Boolean).join(" — ");
    const outcome = (I18N[lang] || {})[`outcome.${e.outcome}`] ? t(`outcome.${e.outcome}`) : e.outcome;
    return `<tr><td>${when}</td><td>${what}</td><td>${e.pattern} · ${outcome}</td></tr>`;
  }).join("") + "</table>";
}

async function refreshNotify(full = true) {
  let data;
  try { data = await (await fetch("/bridge/notify")).json(); } catch { return; }
  renderLog(data.recent);
  const kde = (data.sources || {}).kdeconnect;
  $("notifSources").textContent = kde
    ? t("notify.sources", kde.detail, kde.bus)
    : t("notify.noSources");
  if (!full && notifConfig) return;
  notifConfig = data.config;
  $("notifEnabled").checked = !!notifConfig.enabled;
  $("notifBudget").textContent = t("notify.budget", notifConfig.powerBudgetMa);
  renderPatterns();
  renderRules();
}

$("notifEnabled").onchange = () => { notifConfig.enabled = $("notifEnabled").checked; };

$("addRule").onclick = () => {
  notifConfig.rules.push({ app: "", pattern: Object.keys(notifConfig.patterns)[0], priority: 10 });
  renderRules();
};

$("saveNotif").onclick = async () => {
  notifConfig.rules = notifConfig.rules.filter((r) => String(r.app).trim());
  await fetch("/bridge/notify/config", { method: "POST", body: JSON.stringify(notifConfig) });
  $("notifSaved").textContent = t("notify.saved");
  setTimeout(() => { $("notifSaved").textContent = ""; }, 2000);
  refreshNotify();
};

setInterval(() => refreshNotify(false), 4000);

let audioConfig = null;

const named = (prefix, key) =>
  (I18N[lang] || {})[`${prefix}.${key}`] ? t(`${prefix}.${key}`) : key;

async function refreshAudio() {
  let data;
  try { data = await (await fetch("/bridge/audio")).json(); } catch { return; }

  if (!data.running) {
    $("audioState").textContent = t("audio.idle");
    $("audioBar").style.width = "0";
    $("audioCounters").textContent = "";
    return;
  }
  $("audioState").textContent = data.error
    ? t("audio.error", data.error)
    : (data.paused ? t("audio.paused") : t("audio.active"));
  $("audioBar").style.width = Math.round((data.level || 0) * 100) + "%";
  $("audioCounters").textContent = t("audio.counters", data.frames, data.dropped);
  $("audioDrive").textContent = data.auto ? t("audio.applied", data.drive) : "";

  if (audioConfig) return;
  audioConfig = data;
  $("audioMode").innerHTML = (data.modes || [])
    .map((m) => `<option value="${m}"${m === data.mode ? " selected" : ""}>` +
                `${named("audio.mode", m)}</option>`).join("");
  $("audioPalette").innerHTML = (data.palettes || [])
    .map((p) => `<option value="${p}"${p === data.palette ? " selected" : ""}>` +
                `${named("audio.palette", p)}</option>`).join("");
  $("audioGain").value = data.gain;
  $("audioAuto").checked = !!data.auto;
  $("audioFps").value = data.fps;
  $("audioCurve").value = data.curve;
  $("audioFloor").value = data.floor;
  $("audioGainValue").textContent = data.gain;
  $("audioFpsValue").textContent = data.fps;
  $("audioCurveValue").textContent = data.curve;
  $("audioFloorValue").textContent = data.floor;
}

async function pushAudio() {
  await fetch("/bridge/audio", { method: "POST", body: JSON.stringify({
    mode: $("audioMode").value,
    palette: $("audioPalette").value,
    gain: parseFloat($("audioGain").value),
    fps: parseInt($("audioFps").value, 10),
    curve: parseFloat($("audioCurve").value),
    floor: parseFloat($("audioFloor").value),
    auto: $("audioAuto").checked,
  })});
}

$("audioMode").onchange = pushAudio;
$("audioPalette").onchange = pushAudio;
$("audioAuto").onchange = pushAudio;
$("audioGain").oninput = () => { $("audioGainValue").textContent = $("audioGain").value; };
$("audioFps").oninput = () => { $("audioFpsValue").textContent = $("audioFps").value; };
$("audioCurve").oninput = () => { $("audioCurveValue").textContent = $("audioCurve").value; };
$("audioFloor").oninput = () => { $("audioFloorValue").textContent = $("audioFloor").value; };
$("audioGain").onchange = pushAudio;
$("audioFps").onchange = pushAudio;
$("audioCurve").onchange = pushAudio;
$("audioFloor").onchange = pushAudio;

setInterval(refreshAudio, 500);
setInterval(() => { if (!flashing) refreshStatus(); }, 2000);

initLanguage();
</script>
</body>
