<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not available over USB</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.6 system-ui,-apple-system,sans-serif; background:#111; color:#ddd; }
  main { max-width:34rem; padding:2rem; }
  h1 { font-size:1.3rem; margin:0 0 1rem; color:#fff; }
  code { background:#222; padding:.1em .4em; border-radius:4px; }
  a { color:#6cf; }
</style>
</head>
<body>
<main id="page"></main>
<script>
const TEXT = {
  en: {
    title: "Not available over USB",
    heading: "This page is not reachable over USB",
    intro: "WLED's firmware only exposes the <strong>state API</strong> on the serial port (<code>deserializeState</code>). The settings pages, the file editor and OTA updates go through its HTTP server only, which is out of reach here since the module is on no network.",
    lead: "What the bridge can still do:",
    items: [
      "all real-time control (colours, effects, palettes, segments, presets);",
      "<strong>firmware updates</strong> through the serial bootloader, from <a href=\"/bridge\">the bridge page</a>;",
      "persistent configuration, by flashing an image that carries it.",
    ],
    back: "← Back to the interface",
  },
  fr: {
    title: "Non disponible en USB",
    heading: "Cette page n'est pas accessible par USB",
    intro: "Le firmware WLED n'expose que l'<strong>API d'état</strong> sur le port série (<code>deserializeState</code>). Les pages de réglages, l'éditeur de fichiers et la mise à jour OTA passent uniquement par son serveur HTTP, inaccessible ici puisque le module n'est pas sur le réseau.",
    lead: "Ce qui reste possible depuis le pont :",
    items: [
      "tout le contrôle temps réel (couleurs, effets, palettes, segments, presets) ;",
      "la <strong>mise à jour du firmware</strong> par le bootloader série, via <a href=\"/bridge\">la page du pont</a> ;",
      "la configuration durable, en reflashant une image qui l'embarque.",
    ],
    back: "← Retour à l'interface",
  },
};

function render(lang) {
  const t = TEXT[lang] || TEXT.en;
  document.documentElement.lang = TEXT[lang] ? lang : "en";
  document.title = t.title;
  document.getElementById("page").innerHTML =
    `<h1>${t.heading}</h1><p>${t.intro}</p><p>${t.lead}</p>` +
    `<ul>${t.items.map((i) => `<li>${i}</li>`).join("")}</ul>` +
    `<p><a href="/">${t.back}</a></p>`;
}

render("en");
fetch("/bridge/ui")
  .then((r) => r.json())
  .then((d) => render(d.language))
  .catch(() => {});
</script>
</body>
</html>
